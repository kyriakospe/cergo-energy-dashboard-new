name: Update dashboard data

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh static data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh dashboard JSON
        run: python scripts/update_data.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_root = Path("public/data")
          paths = sorted(data_root.rglob("*.json")) + sorted(data_root.rglob("*.geojson"))
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(paths)} dashboard data files.")
          PY

      - name: Commit refreshed data
        run: |
          if [[ -z "$(git status --porcelain public/data)" ]]; then
            echo "No dashboard data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh dashboard data"
          git push
